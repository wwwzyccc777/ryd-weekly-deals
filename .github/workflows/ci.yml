name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci
      - name: Package source download
        run: python3 scripts/package-source.py
      - name: Build Worker
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Validate artifact
        run: npm run validate
